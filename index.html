<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viaje de Flores Amarillas 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    /* Pantalla inicial con botón */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      background: radial-gradient(circle at center, #111122 0%, #050508 100%);
      transition: opacity 1s ease, visibility 1s ease;
    }

    #start-btn {
      padding: 18px 36px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #1a1a1a;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      transition: all 0.3s ease;
      outline: none;
    }

    #start-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
    }

    /* Lienzo para la animación 3D Canvas */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* Resplandor central suave */
    .glow-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,200,0,0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Pantalla con botón inicial -->
  <div id="start-screen">
    <button id="start-btn">🌻 Iniciar Viaje 🌻</button>
  </div>

  <!-- Resplandor ambiental de fondo -->
  <div class="glow-center"></div>

  <!-- Canvas animado -->
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Frases que aparecerán volando hacia ti
    const phrases = [
      "Eres especial ✨",
      "Flores para ti 🌻",
      "Siempre brillas 🌟",
      "Contigo todo es mejor ❤️",
      "Un sol para ti ☀️",
      "Feliz día 💛",
      "Eres mi persona favorita",
      "Nunca dejes de sonreír 😊",
      "Para ti 🎁",
      "Te quiero mucho 💕"
    ];

    // SVG vectorial del Girasol renderizado directamente
    const sunflowerSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
        <!-- Tallo y Hojas -->
        <path d="M50 60 Q 48 90 50 120" stroke="#3a802d" stroke-width="5" fill="none" />
        <path d="M50 90 Q 30 80 20 88 Q 35 100 50 95" fill="#4a9e3b" />
        <path d="M50 80 Q 70 70 80 78 Q 65 90 50 85" fill="#4a9e3b" />
        
        <!-- Pétalos -->
        <g fill="#ffc800">
          <ellipse cx="50" cy="20" rx="7" ry="20" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(30 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(60 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(90 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(120 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(150 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(180 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(210 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(240 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(270 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(300 50 50)" />
          <ellipse cx="50" cy="20" rx="7" ry="20" transform="rotate(330 50 50)" />
        </g>
        
        <!-- Centro del Girasol -->
        <circle cx="50" cy="50" r="16" fill="#5c3a21" />
        <circle cx="50" cy="50" r="14" fill="#3d2312" />
      </svg>
    `;

    const flowerImg = new Image();
    flowerImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(sunflowerSVG);

    // Sistema 3D de elementos volando en la pantalla
    const numItems = 90;
    const items = [];
    let isRunning = false;

    class StarItem {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = initial ? Math.random() * 1000 : 1000;
        
        const rand = Math.random();
        if (rand > 0.4) {
          this.type = 'flower';
          this.text = phrases[Math.floor(Math.random() * phrases.length)];
        } else if (rand > 0.15) {
          this.type = 'text';
          this.text = phrases[Math.floor(Math.random() * phrases.length)];
        } else {
          this.type = 'sparkle';
        }
      }

      update() {
        this.z -= 4; // Velocidad de avance

        if (this.z <= 1) {
          this.reset(false);
        }
      }

      draw() {
        const k = 400 / this.z;
        const px = this.x * k + width / 2;
        const py = this.y * k + height / 2;

        if (px < -100 || px > width + 100 || py < -100 || py > height + 100) return;

        const scale = Math.max(0.1, (1000 - this.z) / 1000);
        const opacity = Math.min(1, scale * 1.5);

        ctx.save();
        ctx.globalAlpha = opacity;

        // Trazado de líneas de estela
        const prevK = 400 / (this.z + 15);
        const prevPx = this.x * prevK + width / 2;
        const prevPy = this.y * prevK + height / 2;
        
        ctx.strokeStyle = `rgba(255, 215, 0, ${opacity * 0.25})`;
        ctx.lineWidth = 1 * scale;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(prevPx, prevPy);
        ctx.stroke();

        if (this.type === 'flower') {
          const imgWidth = 80 * scale;
          const imgHeight = 96 * scale;

          ctx.drawImage(flowerImg, px - imgWidth / 2, py - imgHeight / 2, imgWidth, imgHeight);

          ctx.font = `${Math.max(10, 15 * scale)}px Arial, sans-serif`;
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 8;
          ctx.textAlign = 'center';
          ctx.fillText(this.text, px, py + imgHeight / 2 + (12 * scale));
        } 
        else if (this.type === 'text') {
          ctx.font = `bold ${Math.max(12, 20 * scale)}px Arial, sans-serif`;
          ctx.fillStyle = '#ffea79';
          ctx.shadowColor = '#ffaa00';
          ctx.shadowBlur = 10;
          ctx.textAlign = 'center';
          ctx.fillText(this.text, px, py);
        } 
        else {
          ctx.fillStyle = '#fff';
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(px, py, 2.5 * scale, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    for (let i = 0; i < numItems; i++) {
      items.push(new StarItem());
    }

    function animate() {
      if (!isRunning) return;

      ctx.fillStyle = 'rgba(5, 5, 8, 0.3)';
      ctx.fillRect(0, 0, width, height);

      items.sort((a, b) => b.z - a.z);

      for (let item of items) {
        item.update();
        item.draw();
      }

      requestAnimationFrame(animate);
    }

    startBtn.addEventListener('click', () => {
      startScreen.style.opacity = '0';
      startScreen.style.visibility = 'hidden';
      
      setTimeout(() => {
        isRunning = true;
        animate();
      }, 300);
    });
  </script>
</body>
</html>
